# Example Docker Compose for Server 130 (Webserver + Scheduler1)
# Replace with your actual configuration

version: '3.8'

x-airflow-common: &airflow-common
  # IMPORTANT: This image reference will be automatically updated by CI/CD pipeline
  image: nexus.yourcompany.com:8443/airflow-custom:latest
  environment:
    - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=mysql+pymysql://airflow:password@172.10.17.131:3306/airflow
    - AIRFLOW__CELERY__RESULT_BACKEND=db+mysql://airflow:password@172.10.17.131:3306/airflow
    - AIRFLOW__CELERY__BROKER_URL=redis://172.10.17.131:6379/0
    - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY}
    - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=true
    - AIRFLOW__CORE__LOAD_EXAMPLES=false
    - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
  volumes:
    - /data/airflow/dags:/opt/airflow/dags
    - /data/airflow/logs:/opt/airflow/logs
    - /data/airflow/plugins:/opt/airflow/plugins
    - /data/airflow/config/airflow.cfg:/opt/airflow/airflow.cfg
  user: "${AIRFLOW_UID:-50000}:0"
  networks:
    - airflow-network

services:
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver-130
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always

  airflow-scheduler-1:
    <<: *airflow-common
    container_name: airflow-scheduler-1-130
    command: scheduler
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--hostname", "$${HOSTNAME}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always

networks:
  airflow-network:
    driver: bridge

# NOTE: The image tag will be automatically updated during deployment
# by the CI/CD pipeline to use the specific commit SHA
