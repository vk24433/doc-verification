# Advanced rollback to specific version
rollback-to-version:
  stage: rollback
  when: manual
  variables:
    ROLLBACK_TAG: ""  # Set this manually when triggering the job
  script:
    - |
      if [ -z "$ROLLBACK_TAG" ]; then
        echo "❌ ROLLBACK_TAG variable must be set!"
        echo "Example: ROLLBACK_TAG=abc123def"
        exit 1
      fi
    - echo "🔄 Rolling back both servers to version: ${ROLLBACK_TAG}"
    - export ROLLBACK_IMAGE="${NEXUS_REGISTRY}/${IMAGE_NAME}:${ROLLBACK_TAG}"
    
    # Server 131
    - |
      ssh -p3535 -i /home/dataeng99/.ssh/dataeng99_id_rsa dataeng99@172.10.17.131 "
        echo '===== Server 131: Rolling back to ${ROLLBACK_IMAGE} =====' &&
        echo '${NEXUS_PASSWORD}' | sudo -u developer docker login ${NEXUS_REGISTRY} -u ${NEXUS_USERNAME} --password-stdin &&
        sudo -u developer docker pull ${ROLLBACK_IMAGE} &&
        sudo -u developer sed -i 's|image:.*airflow.*|image: ${ROLLBACK_IMAGE}|g' /data/code/99acres_analytics/data_lake_tools/data-platform-applications/airflow/docker/docker-compose-server-131.yaml &&
