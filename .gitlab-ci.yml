# -----------------------------
# Rollback Jobs (Manual Trigger)
# -----------------------------
rollback-server-131:
  stage: rollback
  when: manual
  script:
    - echo "🔄 Rolling back Server 131 to previous deployment..."
    - |
      ssh -p3535 -i /home/dataeng99/.ssh/dataeng99_id_rsa dataeng99@172.10.17.131 "
        echo '===== Reading previous deployment metadata =====' &&
        if [ ! -f /data/airflow-deployments/previous-deployment-131.json ]; then
          echo '❌ No previous deployment found for rollback!'
          exit 1
        fi &&
        
        ROLLBACK_IMAGE=\$(sudo -u developer cat /data/airflow-deployments/previous-deployment-131.json | grep -o '\"image\":\"[^\"]*\"' | cut -d'\"' -f4) &&
        echo \"Rolling back to image: \$ROLLBACK_IMAGE\" &&
        
        echo '===== Login to Nexus Docker Registry =====' &&
        echo '${NEXUS_PASSWORD}' | sudo -u developer docker login ${NEXUS_REGISTRY} -u ${NEXUS_USERNAME} --password-stdin &&
        
        echo '===== Pulling rollback image =====' &&
        sudo -u developer docker pull \$ROLLBACK_IMAGE &&
        
        echo '===== Updating docker-compose with rollback image =====' &&
        sudo -u developer sed -i \"s|image:.*airflow.*|image: \$ROLLBACK_IMAGE|g\" /data/code/99acres_analytics/data_lake_tools/data-platform-applications/airflow/docker/docker-compose-server-131.yaml &&
        
        echo '===== Deploying docker-compose with rollback image =====' &&
        sudo -u developer /data/binaries/docker-compose -f /data/code/99acres_analytics/data_lake_tools/data-platform-applications/airflow/docker/docker-compose-server-131.yaml up -d &&
        
        echo '===== Swapping deployment metadata =====' &&
        sudo -u developer cp /data/airflow-deployments/previous-deployment-131.json /data/airflow-deployments/current-deployment-131.json &&
        
        echo \"✅ Rollback completed on Server 131 to \$ROLLBACK_IMAGE\"
      "

