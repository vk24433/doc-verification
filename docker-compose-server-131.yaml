# box: 131
# MySQL + Scheduler2
version: '3'

x-airflow-volumes: &common_airflow_volumes
  - /data/code/99acres_analytics/data_lake_tools/data-platform-applications/airflow/dags:/opt/airflow/dags
  - /data/code/99acres_analytics/data_lake_tools/data-platform-applications/airflow/logs:/opt/airflow/logs
  - /data/code/99acres_analytics/data_lake_tools/data-platform-applications/airflow/config/airflow.cfg:/opt/airflow/airflow.cfg
  - /data/credentials:/home/airflow/.aws/credentials:ro
  - /data/config:/home/airflow/.aws/config:ro
  - /data:/data:rw

x-airflow-environment: &common_airflow_env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__SQL_ALCHEMY_CONN: mysql+mysqldb://airflow:airflow@172.10.17.131:33307/airflow
  AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
  AIRFLOW__CORE__SQL_ALCHEMY_POOL_RECYCLE: 3600

x-airflow-common: &common_airflow
  # Use custom image with fallback to public image
  image: ${CUSTOM_IMAGE_NAME:-airflow-custom}:${CUSTOM_IMAGE_TAG:-latest-stable}
  user: "${AIRFLOW_UID:-50000}:${AIRFLOW_GID:-50000}"
  volumes: *common_airflow_volumes
  environment: *common_airflow_env

services:
  airflow_2.11-mysql_8.0:
    image: mysql:8.0.33
    container_name: airflow_2.11-mysql_8.0
    ports:
      - "33307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: airflow
      MYSQL_DATABASE: airflow
      MYSQL_USER: airflow
      MYSQL_PASSWORD: airflow
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --explicit_defaults_for_timestamp=1
    volumes:
      - /data/code/99acres_analytics/data_lake_tools/data-platform-applications/airflow/mysql_8.0/mysqldb:/var/lib/mysql
      - /data/code/99acres_analytics/data_lake_tools/data-platform-applications/airflow/mysql_8.0/blogs:/var/log/mysql
      - /data/code/99acres_analytics/data_lake_tools/data-platform-applications/airflow/mysql_8.0/config/my.cnf:/etc/mysql/my.cnf
      - /data/code/99acres_analytics/data_lake_tools/data-platform-applications/airflow/mysql_8.0/config/mysql.conf.d:/etc/mysql/mysql.conf.d
      - /data/code/99acres_analytics/data_lake_tools/data-platform-applications/airflow/mysql_8.0/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always

  airflow_2.11-init:
    <<: *common_airflow
    container_name: airflow_2.11-init
    entrypoint: /bin/bash
    command: >
      -c "
      airflow db init &&
      airflow db upgrade &&
      airflow users create -r Admin -u admin -e airflow@airflow.com -f admin -l user -p airflow || echo 'User might already exist'
      "
    depends_on:
      airflow_2.11-mysql_8.0:
        condition: service_healthy
    restart: "no"

  airflow_2.11-scheduler2:
    <<: *common_airflow
    container_name: airflow_2.11-scheduler_2
    command: scheduler
    restart: always
    depends_on:
      airflow_2.11-init:
        condition: service_completed_successfully
      airflow_2.11-mysql_8.0:
        condition: service_healthy
    healthcheck:
      test: sh -c "airflow jobs check --job-type SchedulerJob --hostname \`hostname\`"
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
